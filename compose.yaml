services:
  catalog-ingestion:
    build:
      context: .
    image: catalog-ingestion-lab:local
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - catalog-data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  catalog-data:
